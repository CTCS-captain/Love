<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>I love you ♥</title>
<style>
  :root { color-scheme: dark; --bg: #0f0000; }
  html, body { margin: 0; height: 100%; background: var(--bg); overflow: hidden; }
  canvas { display: block; width: 100%; height: 100%; touch-action: manipulation; }

  #nextBtn, #backBtn {
    position: fixed; left: 50%; transform: translateX(-50%);
    bottom: calc(28px + env(safe-area-inset-bottom, 0px));
    padding: 12px 34px; border-radius: 999px;
    border: 1px solid rgba(255, 200, 200, .55);
    background: rgba(15, 0, 0, .45); color: #ffc8c8;
    font: bold 18px Georgia, "Times New Roman", serif; letter-spacing: .04em;
    cursor: pointer; opacity: 0; visibility: hidden;
    transition: opacity .9s, visibility .9s, background .2s;
    -webkit-tap-highlight-color: transparent;
  }
  #nextBtn.show, #scene.on #backBtn { opacity: 1; visibility: visible; }
  #nextBtn:hover, #backBtn:hover { background: rgba(255, 60, 60, .25); }
  #nextBtn:focus-visible, #backBtn:focus-visible { outline: 2px solid #ffc8c8; outline-offset: 3px; }
  #scene {
    position: fixed; inset: 0; display: grid; place-items: center; align-content: center;
    padding: env(safe-area-inset-top, 0px) 16px env(safe-area-inset-bottom, 0px);
    background: rgba(15, 0, 0, .86);
    opacity: 0; visibility: hidden; transition: opacity 1s, visibility 1s;
  }
  #scene.on { opacity: 1; visibility: visible; }
  #scene figure { margin: 0; text-align: center; }
  #scene img { display: block; width: min(88vw, 540px); height: auto; border-radius: 14px; margin: 0 auto; }
  #scene figcaption {
    margin-top: 22px; color: #ffc8c8;
    font: bold clamp(28px, 7vw, 44px) Georgia, "Times New Roman", serif;
    text-shadow: 0 0 18px rgba(255, 60, 60, .7);
  }
</style>

  function newHeart(x, y, order, kind) {
    return {
      x, y, order, kind,
      word: pick(CFG.heartWords), col: pick(CFG.colors),
      alpha: 0, flick: rnd(0, TAU), delay: 0, mult: rnd(0.85, 1.15),
    };
  }

  function genOutline() {
    const out = [], placed = [], gap = CFG.outlineGap * k, n = CFG.nOutline;
    for (let i = 0; i < n; i++) {
      const [sx, sy] = toScreen(...heartParam((i / n) * TAU));
      if (tooClose(sx, sy, placed, gap)) continue;
      placed.push([sx, sy]);
      out.push(newHeart(sx, sy, i, "outline"));
    }
    return out;
  }

  function genFill() {
    const out = [], placed = [], gap = CFG.fillGap * k;
    for (let a = 0; a < CFG.nFill * 80 && out.length < CFG.nFill; a++) {
      const r = rnd(0, 0.86);
      const [hx, hy] = heartParam(rnd(0, TAU));
      const [sx, sy] = toScreen(hx * r, hy * r);
      if (tooClose(sx, sy, placed, gap)) continue;
      placed.push([sx, sy]);
      out.push(newHeart(sx, sy, ri(0, 50), "fill"));
    }
    return out;
  }

  function resetFloat(p, scatter) {
    p.x = rnd(30, W - 30);
    p.y = scatter ? rnd(0, H) : H + rnd(20, 100);
    p.word = pick(CFG.floatWords);
    p.col = pick(CFG.colors);
    p.size = ri(10, 18);
    p.alpha = 0;
    p.maxAlpha = ri(40, 120);
    p.vx = rnd(-0.3, 0.3) * fs;
    p.vy = rnd(-1.2, -0.4) * fs;
    p.swaySpeed = rnd(0.01, 0.04);
    p.swayAmount = rnd(0.3, 1.0) * fs;
    p.phase = rnd(0, TAU);
    p.fadingIn = true;
    p.life = 0;
    p.maxLife = ri(300, 700);
    return p;
  }

  function updateFloat(p) {
    p.life++;
    p.x += p.vx + Math.sin(frame * p.swaySpeed + p.phase) * p.swayAmount;
    p.y += p.vy;
    if (p.fadingIn) {
      p.alpha = Math.min(p.maxAlpha, p.alpha + 3);
      if (p.alpha >= p.maxAlpha) p.fadingIn = false;
    }
    if (p.life > p.maxLife - 60) p.alpha = Math.max(0, p.alpha - 3);
    if (p.y < -50 || p.x < -50 || p.x > W + 50 || (p.alpha <= 0 && p.life > 60)) resetFloat(p, false);
  }

  function setDelays() {
    const span = hearts.reduce((m, p) => (p.kind === "outline" ? Math.max(m, p.order) : m), 0);
    fillStart = Math.floor(span * CFG.framesPerStep) + CFG.fillDelayOffset;
    centerStart = fillStart + CFG.centerDelay;
    for (const p of hearts) {
      p.delay = p.kind === "outline" ? Math.floor(p.order * CFG.framesPerStep) : fillStart + p.order;
      p.alpha = frame > p.delay + 10 ? 255 : 0;
    }
  }

  function rebuild() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = Math.round(W * dpr);
    canvas.height = Math.round(H * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    k = Math.min(W, H) / 1000;
    fs = Math.min(1, Math.max(k, 0.6));
    scale = 20 * k;
    yOff = -45 * k;
    cache = new Map();
    hearts = genOutline().concat(genFill());
    setDelays();
    const n = Math.max(120, Math.min(CFG.nFloatMax, Math.round((W * H) / 1900)));
    floats = Array.from({ length: n }, () => resetFloat({}, true));
  }

  function step() {
    frame++;
    for (const p of floats) updateFloat(p);
    for (const p of hearts) {
      if (frame > p.delay && p.alpha < 255) {
        p.alpha = Math.min(255, p.alpha + CFG.fadeMin + ri(0, CFG.fadeRand));
      }
    }
  }

  function draw() {
    ctx.globalAlpha = 1;
    ctx.fillStyle = CFG.bg;
    ctx.fillRect(0, 0, W, H);

    const items = [];
    for (const p of hearts) {
      const flick = p.alpha >= 255 ? 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flick) : 1;
      const a = Math.floor(p.alpha * flick);
      if (a <= 0) continue;
      const base = p.kind === "outline" ? 20 : 17;
      items.push([sprite(p.word, p.col, base * fs * p.mult, SANS, true), p.x, p.y, a]);
    }

    ctx.globalCompositeOperation = "lighter";
    for (const [s, x, y, a] of items) {
      if (a <= 10) continue;
      for (const [f, d] of [[2.4, 7], [1.6, 3]]) {
        ctx.globalAlpha = Math.max(0, a / 255 / d);
        const w = s.w * f, h = s.h * f;
        ctx.drawImage(s.c, x - w / 2, y - h / 2, w, h);
      }
    }
    ctx.globalCompositeOperation = "source-over";

    for (const p of floats) {
      if (p.alpha <= 0) continue;
      const s = sprite(p.word, p.col, p.size * fs, SANS, false);
      ctx.globalAlpha = p.alpha / 255;
      ctx.drawImage(s.c, p.x - s.w / 2, p.y - s.h / 2, s.w, s.h);
    }
    for (const [s, x, y, a] of items) {
      ctx.globalAlpha = a / 255;
      ctx.drawImage(s.c, x - s.w / 2, y - s.h / 2, s.w, s.h);
    }

    if (frame > centerStart) {
      const progress = Math.min(1, (frame - centerStart) / 30);
      const ca = 1 - Math.exp(-progress * 8);
      const pulse = 1 + 0.025 * Math.sin(frame * 0.05);
      ctx.font = "bold " + 54 * fs + "px " + SERIF;
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillStyle = "rgb(255,200,200)";
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(pulse * 1.4, pulse * 1.4);
      ctx.globalAlpha = ca / 5;
      ctx.fillText(CFG.centerText, 0, 0);
      ctx.restore();
      ctx.save();
      ctx.translate(W / 2, H / 2);
      ctx.scale(pulse, pulse);
      ctx.globalAlpha = ca;
      ctx.fillText(CFG.centerText, 0, 0);
      ctx.restore();
    }
    ctx.globalAlpha = 1;
  }

  const STEP = 1000 / 30;
  let last = 0, acc = 0;
  function tick(t) {
    if (!last) last = t;
    acc += Math.min(t - last, 100);
    last = t;
    let n = 0;
    while (acc >= STEP && n < 8) { step(); acc -= STEP; n++; }
    if (n === 8) acc = 0;
    draw();
    nextBtn.classList.toggle("show", frame > centerStart + 60 && !scene.classList.contains("on"));
    requestAnimationFrame(tick);
  }

  let timer;
  window.addEventListener("resize", () => {
    clearTimeout(timer);
    timer = setTimeout(rebuild, 150);
  });
  canvas.addEventListener("pointerdown", () => {
    frame = 0;
    for (const p of hearts) p.alpha = 0;
  });

  const nextBtn = document.getElementById("nextBtn");
  const scene = document.getElementById("scene");
  const showScene = (on) => {
    scene.classList.toggle("on", on);
    scene.setAttribute("aria-hidden", on ? "false" : "true");
  };
  nextBtn.addEventListener("click", () => showScene(true));
  document.getElementById("backBtn").addEventListener("click", () => showScene(false));

  rebuild();
  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
